name: Treasure
options:
  bundleIdPrefix: org.nighthawklabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D9B866T935
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.8
targets:
  Treasure:
    type: application
    platform: iOS
    sources: [Treasure]
    dependencies:
      - package: Clerk
        product: ClerkKit
    info:
      path: Treasure/Resources/Info.plist
      properties:
        CFBundleDisplayName: Treasure
        # Same Clerk instance and router as AutoTelemetry and the web app. The publishable key is public by design.
        RouterBaseURL: https://harness-router.nighthawklabs.org
        ClerkPublishableKey: pk_test_cHJpbWFyeS1qYXktMjEuY2xlcmsuYWNjb3VudHMuZGV2JA==
        # Lets Debug builds reach a finance-engine on this Mac (-dev-engine); plain HTTP stays blocked for everything else.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSFaceIDUsageDescription: Unlock Treasure with Face ID.
        NSCameraUsageDescription: Scan receipts and statements. Images are read on this device and are not uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nighthawklabs.treasure
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
  TreasureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TreasureTests
      # Real engine responses, shared with the Android tests (clients/fixtures); decoded by ContractTests.
      - path: ../fixtures
        buildPhase: resources
    dependencies:
      - target: Treasure
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.nighthawklabs.treasure.tests
  TreasureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TreasureUITests]
    dependencies:
      - target: Treasure
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.nighthawklabs.treasure.uitests
schemes:
  Treasure:
    build:
      targets: { Treasure: all }
    test:
      targets: [TreasureTests, TreasureUITests]
